- hosts: compute
  become: true
  vars:
    destroy: false
  gather_facts: true
  roles:
    - oci-hostname

- hosts: compute
  become: true
  gather_facts: true
  vars_files:
    - "/opt/oci-hpc/conf/queues.conf"
  tasks: 
    - include_role:  
        name: hostname
      when: slurm | default(false) | bool

- hosts: compute
  become: true
  vars: 
    destroy: false
  gather_facts: true
  roles: 
    - ssh
    - firewall
    - privilege_group
    - boot-volume

- hosts: compute
  become: true
  tasks: 
    - include_role: 
        name: localdisk
      when: localdisk | default(true) | bool

- hosts: compute
  become: true
  tasks:
    - include_role:
        name: local-block-volume
      when: use_local_block_volume | default(false) | bool

- hosts: compute
  become: true
  gather_facts: true
  tasks: 
    - include_role: 
        name: healthchecks

- hosts: controller,slurm_backup,login,compute
  become: true
  vars: 
    destroy: false
  gather_facts: true
  roles: 
    - etc-hosts
      
- hosts: nfs
  become: true
  vars:
     export_path: "{{ scratch_nfs_path }}"
     export_name: "scratch"
     local_path:  "/mnt/localdisk/nfs"
     iscsi_ip: "{{ cluster_mount_ip }}"

  tasks: 
    - include_role: 
        name: iscsi
      when: scratch_nfs_type == "block" and scratch_nfs|default(true)|bool
    - include_role: 
        name: nfs-server
      when: scratch_nfs|default(true)|bool

- hosts: compute
  become: true
  
  tasks: 
    - include_role: 
        name: nfs-client
      vars: 
        local_path: "{{ cluster_nfs_path }}"
        export_host: "{{ hostvars[groups['controller'][0]]['ansible_default_ipv4']['address'] }}"
        export_path: "/export/cluster"
        options: "defaults,noatime,bg,timeo=100,ac,rsize=1048576,wsize=1048576,local_lock={{ lock }},mountproto=tcp,sec=sys,_netdev"
        lock: "all"
      when: cluster_nfs|default(true)|bool
    - include_role: 
        name: nfs-client
      vars: 
        local_path: "{{ scratch_nfs_path }}"
        export_host: "{{ hostvars[groups['nfs'][0]]['ansible_default_ipv4']['address'] }}"
        export_path: "/mnt/localdisk/nfs"
        options: "defaults,noatime,bg,timeo=100,ac,rsize=1048576,wsize=1048576,local_lock={{ lock }},mountproto=tcp,sec=sys,_netdev"
        lock: "none" 
      when: scratch_nfs|default(true)|bool

- hosts: compute
  become: true
  vars_files:
    - "/opt/oci-hpc/playbooks/roles/openldap/defaults/main.yml"
    - "/opt/oci-hpc/playbooks/roles/openldap/vars/el_vars.yml"
    - "/opt/oci-hpc/playbooks/roles/openldap/vars/debian_vars.yml"
  tasks:
    - include_role:
        name: sssd
      when: ldap|default(true)|bool

- hosts: compute
  become: true
  gather_facts: true
  tasks: 
    - include_role:
        name: hyperthreading

- hosts: compute
  become: true
  tasks:
    - include_role:
        name: home_nfs
      when: home_nfs|default(true)|bool
    - include_role:
        name: nfs-client
      vars:
        local_path: "/home"
        export_host: "{{ hostvars[groups['controller'][0]]['ansible_default_ipv4']['address'] }}"
        export_path: "/home"
        options: "defaults,noatime,bg,timeo=100,ac,rsize=1048576,wsize=1048576,local_lock={{ lock }},mountproto=tcp,sec=sys,_netdev"
        lock: "all"
      when: home_nfs|bool and (not home_fss|bool)
    - include_role:
        name: nfs-client
      vars:
        local_path: "/home"
        export_host: "{{ nfs_source_IP }}"
        export_path: "{% if create_fss|bool %}/home{% else%}{{nfs_source_path}}/home{% endif %}"
        options: ""
        lock: "none"
      when: home_nfs|bool and home_fss|bool
    - include_role:
        name: nfs-client
      vars:
        local_path: "{{ nfs_target_path }}"
        export_host: "{{ nfs_source_IP }}"
        export_path: "{{ nfs_source_path }} "
        options: "{{ nfs_options }}"
        lock: "none"
      when: add_nfs|default(false)|bool or create_fss|default(false)|bool
     
- hosts: compute
  tasks:  
    - include_role: 
        name: latency_check
      when: cluster_network|bool and latency_check|bool

- hosts: all
  become: true
  tasks: 
    - include_role: 
        name: fix_ldap
      when: ldap|default(true)|bool

- hosts: compute
  become: true
  gather_facts: true
  tasks:
    - include_role:
        name: desktop
      when:
        - use_ood | default(false) | bool
        - queue | default('') == 'vnc'
    - include_role:
        name: amazon-dcv
      when:
        - use_ood | default(false) | bool
        - ood_dcv_enabled | default(false) | bool
        - queue | default('') == 'dcv'

- hosts: compute, slurm_backup
  vars:
    destroy: false
    initial: false
    download_path: "{{ cluster_nfs_path if cluster_nfs | bool else (nfs_target_path if create_fss | bool else '/tmp') }}"
    enroot_top_path: "{{ nvme_path }}/enroot/"
  vars_files:
    - "/opt/oci-hpc/conf/queues.conf"
  tasks:
    - include_role: 
        name: spack
      when: spack|default(false)|bool
    - include_role:
        name: openfoam
      when: install_application|default(false)|bool and install_openfoam|default(false)|bool
    - include_role:
        name: paraview
      when: install_application|default(false)|bool and install_paraview|default(false)|bool
    - include_role: 
        name: slurm
      when: slurm|default(false)|bool
    - include_role: 
        name: influxdb
      when: monitoring|default(false)|bool
    - include_role:
        name: telegraf
      when: monitoring|default(false)|bool
