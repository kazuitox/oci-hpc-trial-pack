---
ssl_cert_path: /etc/ssl/certs
ssl_ca_cert: "{{ ssl_cert_path }}/cluster-ca.crt"
ssl_cert_days: 3650

ood_tls_cert: /etc/pki/tls/certs/ood-ip.crt
ood_tls_key: /etc/pki/tls/private/ood-ip.key
ood_tls_csr: /etc/pki/tls/certs/ood-ip.csr
ood_tls_config: /etc/pki/tls/certs/ood-ip-openssl.cnf
ood_tls_days: 825
ood_public_hostname: ""

ood_enable_dex_ldap: "{{ ldap | default(true) | bool }}"
ood_ldap_host: "{{ (openldap_host | default('controller.cluster')) ~ ':636' }}"
ood_ldap_user_base_dn: dc=local
ood_ldap_user_filter: "(objectClass=posixAccount)"
ood_ldap_username_attr: uid
ood_ldap_id_attr: uid
ood_ldap_email_attr: uid
ood_ldap_name_attr: gecos
ood_ldap_preferred_username_attr: uid
ood_ldap_root_ca: /etc/openldap/certs/cluster-ca.crt
ood_ldap_insecure_skip_verify: false
ood_ldap_anonymous_bind: true
ood_ldap_bind_dn: ""
ood_ldap_bind_pw: ""

ood_enable_dex_static: true
ood_dex_static_username: "{{ controller_username | default('opc') }}"
ood_dex_static_email: "{{ ood_dex_static_username }}@example.local"
ood_dex_static_user_id: "{{ ood_dex_static_username }}"
ood_dex_static_hash: ""

ood_oidc_remote_user_claim: email
ood_oidc_ssl_validate_server: "On"
ood_user_map_cmd: /usr/local/sbin/ood-user-map
ood_host_regex: "(compute|desktop|vnc|dcv)-[\\w-]+"
ood_shell_inactive_timeout_ms: 1800000

ood_desktop_use_gpu: false
ood_vnc_vgl_group: vglusers
ood_vnc_vgl_gid: 9877
ood_vnc_cpus_per_task: 8
ood_vnc_queue: vnc
ood_dcv_enabled: false
ood_dcv_queue: dcv
ood_dcv_cpus_per_task: "{{ 8 if (ood_desktop_use_gpu | default(false) | bool) else 2 }}"
# OpenComposer is installed as an Open OnDemand system app. Keep the release
# pinned so re-running the playbook cannot silently upgrade the application.
ood_opencomposer_repository: https://github.com/RIKEN-RCCS/OpenComposer.git
ood_opencomposer_version: v2.0.2
ood_opencomposer_revision: 7af3d94b36043d8019b1639cd8e463957eb7a37e
ood_opencomposer_install_dir: /var/www/ood/apps/sys/OpenComposer
ood_opencomposer_history_link_dir: /var/www/ood/apps/sys/OpenComposerHistory
ood_opencomposer_apps_dir: /etc/ood/config/opencomposer/apps
ood_opencomposer_scheduler_bin: "{{ slurm_exec | default('/usr') }}/bin"
ood_opencomposer_copy_environment: false
