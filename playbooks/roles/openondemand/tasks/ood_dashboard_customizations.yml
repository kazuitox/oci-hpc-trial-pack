---
- name: OpenOnDemand dashboard | Ensure config override directories exist
  ansible.builtin.file:
    path: "/etc/ood/config/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ondemand.d
    - locales
    - apps/dashboard/initializers
    - apps/dashboard/views/widgets

- name: OpenOnDemand dashboard | Render dashboard configuration
  ansible.builtin.template:
    src: ondemand.yml.j2
    dest: /etc/ood/config/ondemand.d/ondemand.yml
    owner: root
    group: root
    mode: "0644"
  register: ood_dashboard_configuration

- name: OpenOnDemand dashboard | Install locale override
  ansible.builtin.copy:
    src: etc/ood/config/locales/en.yml
    dest: /etc/ood/config/locales/en.yml
    owner: root
    group: root
    mode: "0644"

- name: OpenOnDemand shell | Ensure application config directory exists
  ansible.builtin.file:
    path: /etc/ood/config/apps/shell
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: OpenOnDemand shell | Configure inactivity timeout
  ansible.builtin.lineinfile:
    path: /etc/ood/config/apps/shell/env
    regexp: '^OOD_SHELL_INACTIVE_TIMEOUT_MS='
    line: "OOD_SHELL_INACTIVE_TIMEOUT_MS={{ ood_shell_inactive_timeout_ms }}"
    create: true
    owner: root
    group: root
    mode: "0644"

- name: OpenOnDemand dashboard | Install the shared OpenComposer frame widget
  ansible.builtin.copy:
    src: etc/ood/config/apps/dashboard/views/widgets/_opencomposer_frame.html.erb
    dest: /etc/ood/config/apps/dashboard/views/widgets/_opencomposer_frame.html.erb
    owner: root
    group: root
    mode: "0644"
  register: ood_opencomposer_frame_widget

- name: OpenOnDemand dashboard | Render OpenComposer endpoint widgets
  ansible.builtin.template:
    src: opencomposer_dashboard_widget.html.erb.j2
    dest: "/etc/ood/config/apps/dashboard/views/widgets/_opencomposer_{{ item.name }}.html.erb"
    owner: root
    group: root
    mode: "0644"
  vars:
    opencomposer_widget_title: "{{ item.title }}"
    opencomposer_widget_endpoint: "{{ item.endpoint }}"
  loop:
    - name: slurm
      title: Slurmジョブ
      endpoint: slurm
    - name: history
      title: History
      endpoint: history
  register: ood_opencomposer_endpoint_widgets

- name: OpenOnDemand dashboard | Show physical cores in System Status
  ansible.builtin.copy:
    src: etc/ood/config/apps/dashboard/initializers/system_status_physical_cores.rb
    dest: /etc/ood/config/apps/dashboard/initializers/system_status_physical_cores.rb
    owner: root
    group: root
    mode: "0644"
  register: ood_system_status_physical_cores

- name: OpenOnDemand dashboard | Request a Passenger restart after dashboard changes
  ansible.builtin.file:
    path: /var/www/ood/apps/sys/dashboard/tmp/restart.txt
    state: touch
    owner: root
    group: root
    mode: "0644"
  when: >-
    ood_dashboard_configuration.changed
    or ood_opencomposer_frame_widget.changed
    or ood_opencomposer_endpoint_widgets.changed
    or ood_system_status_physical_cores.changed

- name: OpenOnDemand dashboard | Ensure system app override directories exist
  ansible.builtin.file:
    path: "/var/www/ood/apps/sys/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - activejobs
    - bc_desktop
    - files
    - myjobs
    - shell
    - system-status

- name: OpenOnDemand dashboard | Install system app overrides
  ansible.builtin.copy:
    src: "var/www/ood/apps/sys/{{ item }}"
    dest: "/var/www/ood/apps/sys/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - activejobs/manifest.yml
    - bc_desktop/form.yml
    - bc_desktop/manifest.yml
    - bc_desktop/submit.yml.erb
    - files/manifest.yml
    - myjobs/manifest.yml
    - shell/manifest.yml
    - system-status/manifest.yml

- name: OpenOnDemand dashboard | Ensure Amazon DCV app directories exist
  ansible.builtin.file:
    path: "/var/www/ood/apps/sys/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - dcv
    - dcv/template
  when: ood_dcv_enabled | bool

- name: OpenOnDemand dashboard | Render Amazon DCV mode-specific app files
  ansible.builtin.template:
    src: "{{ role_path }}/files/var/www/ood/apps/sys/dcv/{{ item }}"
    dest: "/var/www/ood/apps/sys/dcv/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - manifest.yml
    - form.yml
    - submit.yml.erb
  when: ood_dcv_enabled | bool

- name: OpenOnDemand dashboard | Install static Amazon DCV app files
  ansible.builtin.copy:
    src: "var/www/ood/apps/sys/dcv/{{ item }}"
    dest: "/var/www/ood/apps/sys/dcv/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - view.html.erb
  when: ood_dcv_enabled | bool

- name: OpenOnDemand dashboard | Render Amazon DCV mode-specific job templates
  ansible.builtin.template:
    src: "{{ role_path }}/files/var/www/ood/apps/sys/dcv/template/{{ item }}"
    dest: "/var/www/ood/apps/sys/dcv/template/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - before.sh.erb
  when: ood_dcv_enabled | bool

- name: OpenOnDemand dashboard | Install static Amazon DCV job templates
  ansible.builtin.copy:
    src: "var/www/ood/apps/sys/dcv/template/{{ item }}"
    dest: "/var/www/ood/apps/sys/dcv/template/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - after.sh.erb
    - script.sh.erb
    - clean.sh.erb
  when: ood_dcv_enabled | bool

- name: OpenOnDemand dashboard | Remove disabled Amazon DCV app
  ansible.builtin.file:
    path: /var/www/ood/apps/sys/dcv
    state: absent
  when: not (ood_dcv_enabled | bool)
