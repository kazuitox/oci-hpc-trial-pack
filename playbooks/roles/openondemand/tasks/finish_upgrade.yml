---
- name: OpenOnDemand | Check installed package version
  ansible.builtin.package_facts:
    manager: auto

- name: OpenOnDemand | Require Open OnDemand 4.2.5
  ansible.builtin.assert:
    that:
      - ansible_facts.packages['ondemand'][0].version == '4.2.5'
    fail_msg: Open OnDemand 4.2.5 is required before completing this upgrade.

- name: OpenOnDemand | Inspect completed upgrade marker
  ansible.builtin.stat:
    path: /etc/ood/config/.oci-hpc-ood-version
  register: ood_upgrade_marker

- name: OpenOnDemand | Read completed upgrade marker
  ansible.builtin.slurp:
    src: /etc/ood/config/.oci-hpc-ood-version
  register: ood_completed_version
  when: ood_upgrade_marker.stat.exists

- name: OpenOnDemand | Complete package upgrade
  when: >-
    ood_package_install.changed
    or (ood_completed_version.content | default('') | b64decode | trim) != '4.2.5'
  block:
    - name: OpenOnDemand | Regenerate staged app configurations
      ansible.builtin.command: /opt/ood/nginx_stage/sbin/update_nginx_stage --quiet
      changed_when: true

    - name: OpenOnDemand | Restart user web processes after package upgrade
      ansible.builtin.command: /opt/ood/nginx_stage/sbin/nginx_stage nginx_clean -f
      changed_when: true

    - name: OpenOnDemand | Record completed upgrade
      ansible.builtin.copy:
        dest: /etc/ood/config/.oci-hpc-ood-version
        content: "4.2.5\n"
        owner: root
        group: root
        mode: "0644"
