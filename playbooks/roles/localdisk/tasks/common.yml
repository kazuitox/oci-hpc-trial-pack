---
- name: Select local NVMe namespace devices
  set_fact:
    localdisk_nvmes: "{{ ansible_devices.keys() | select('match', '^nvme[0-9]+n1$') | list }}"
    localdisk_mount_path: "{{ nvme_path | regex_replace('/+$', '') }}"
    localdisk_optional_compute: "{{ (role | default('')) == 'compute' and not (initial | default(false) | bool) }}"

- name: Configure local NVMe scratch
  block:
    - name: Inspect and configure local NVMe devices
      script: "{{ role_path }}/files/localdisk.py"
      environment:
        LOCALDISK_DEVICES: "{{ localdisk_nvmes | join(',') }}"
        LOCALDISK_MOUNT: "{{ localdisk_mount_path }}"
        LOCALDISK_LOG_VOL: "{{ log_vol | default(false) | bool | ternary('true', 'false') }}"
        LOCALDISK_REDUNDANCY: "{{ redundancy | default(true) | bool | ternary('true', 'false') }}"
        LOCALDISK_RAID_NOSYNC: "{{ localdisk_raid_nosync | bool | ternary('true', 'false') }}"
      register: localdisk_setup
      changed_when: >-
        (localdisk_setup.rc | default(1)) == 0 and
        '"changed": true' in (localdisk_setup.stdout | default(''))

    - name: Read local NVMe mount plan
      set_fact:
        localdisk_mounts: "{{ (localdisk_setup.stdout | from_json).mounts }}"
        localdisk_unused_nvmes: "{{ (localdisk_setup.stdout | from_json).unused }}"

    - name: Report unallocated odd NVMe
      debug:
        msg: >-
          localdisk on {{ inventory_hostname }} leaves {{ localdisk_unused_nvmes | join(',') }}
          unused; this is not a hot spare.
      when: localdisk_unused_nvmes | length > 0

    - name: Mount local NVMe scratch
      mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: xfs
        opts: "{{ item.opts }}"
        state: mounted
      loop: "{{ localdisk_mounts }}"
      loop_control:
        label: "{{ item.src }} -> {{ item.path }}"

    - name: Set local NVMe scratch permissions
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ privilege_group_name }}"
        mode: '0775'
        recurse: false
      loop: "{{ localdisk_mounts }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Rebuild initramfs on Ubuntu
      shell: update-initramfs -k all -u
      when: ansible_facts['distribution'] == "Ubuntu"

  rescue:
    - name: Warn about optional Autoscaling compute scratch failure
      debug:
        msg: >-
          WARNING: localdisk failed on {{ inventory_hostname }} while
          {{ ansible_failed_task.name }}; NVMe={{ localdisk_nvmes | join(',') }};
          {{ ansible_failed_result.stderr | default(ansible_failed_result.msg | default(ansible_failed_result)) }}.
          Node configuration continues, but scratch is unavailable.
      when: localdisk_optional_compute | bool

    - name: Fail required local scratch configuration
      fail:
        msg: >-
          localdisk failed on {{ inventory_hostname }} while {{ ansible_failed_task.name }};
          NVMe={{ localdisk_nvmes | join(',') }};
          {{ ansible_failed_result.stderr | default(ansible_failed_result.msg | default(ansible_failed_result)) }}
      when: not (localdisk_optional_compute | bool)
