munge_conf_path: '/etc/munge'
slurm_spool_path: '/var/spool/slurmd'
munge_log_path: '/var/log/munge'
munge_run_path: '/var/run/munge'
slurm_db_user: 'slurm_accounting' 
slurm_db_name: 'slurm_accounting'
slurm_gid: 1501
slurm_uid: 1501
munge_gid: 1500
munge_uid: 1500
rack_aware_playbook_suffix: "{% if rack_aware|bool %}-rack-aware{% endif%}"
slurm_version: "23.02.5-1"
slurm_deb_distribution_version: "{{ ansible_distribution_version }}"
slurm_deb_package: "slurm-{{ slurm_version }}_{{ slurm_deb_distribution_version }}_amd64.deb"
slurm_job_notifications_enabled: false
slurm_notification_registry_path: /opt/oci-hpc/conf/slurm_notification_users.json
slurm_notification_deployment_id: ""
slurm_notification_spool_path: /var/spool/slurm-oci-notify

slurm_user_tags_enabled: true
slurm_user_tags_state_dir: "{{ slurm_nfs_path }}/oci-user-tags"
slurm_user_tags_local_cache_dir: /var/lib/slurm-oci-user-tags
