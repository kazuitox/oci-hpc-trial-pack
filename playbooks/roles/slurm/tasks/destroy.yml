---
- name: change Node Status
  become: true
  command: "scontrol update nodename={{ ansible_hostname }} state=future reason=terminating"
  ignore_errors: true
  ignore_unreachable: True
  delegate_to: 127.0.0.1

- name: Collect nodes to return to the inactive switch
  set_fact:
    nodes_to_add: "{{ play_hosts | difference(groups['controller']) | difference(groups['slurm_backup']) | difference(groups['login']) | map('extract', hostvars, 'ansible_hostname') | list }}"
  run_once: true

- name: Resolve the inactive switch for this queue and instance type
  set_fact:
    topology_keywords: "{{ queues | selectattr('name', 'equalto', queue) | map(attribute='instance_types') | flatten | selectattr('name', 'equalto', instance_type) | map(attribute='instance_keyword') | list }}"
  run_once: true

- name: Require one instance keyword
  assert:
    that:
      - topology_keywords | length == 1
      - topology_keywords[0] | length > 0
    fail_msg: "Expected exactly one instance type in queue {{ queue }}"
  run_once: true

- name: Update topology using exact switch identities
  become: true
  slurm_topology:
    path: "{{ slurm_conf_path }}/topology.conf"
    cluster: "{{ cluster_name }}"
    inactive: "inactive-{{ queue }}-{{ topology_keywords[0] }}"
    nodes: "{{ nodes_to_add }}"
    action: "remove"
  run_once: true
  delegate_to: 127.0.0.1
  notify: reconfigure slurm

- name: Reconfigure Slurm for topology
  become: true
  command: "scontrol reconfigure"
  delegate_to: 127.0.0.1
  run_once: true
  ignore_errors: true
