---
- name: Check munge group
  command: getent group munge
  register: munge_group
  changed_when: false
  failed_when: false

- name: create munge group
  become: true
  group:
    name: munge
    gid: "{{ munge_gid }}"
    state: present
    system: yes
  when: munge_group.rc != 0

- name: Check munge user
  command: getent passwd munge
  register: munge_user
  changed_when: false
  failed_when: false

- name: create munge user
  become: true
  user:
    name: munge
    comment: "munge"
    uid: "{{ munge_uid }}"
    group: "{{ munge_gid }}"
    shell: /sbin/nologin
    home: /var/lib/munge
    state: present
  when: munge_user.rc != 0

- name: Check slurm group
  command: getent group slurm
  register: slurm_group
  changed_when: false
  failed_when: false

- name: create slurm group
  become: true
  group:
    name: slurm
    gid: "{{ slurm_gid }}"
    state: present
    system: yes
  when: slurm_group.rc != 0

- name: Check slurm user
  command: getent passwd slurm
  register: slurm_user
  changed_when: false
  failed_when: false

- name: create slurm user
  become: true
  user:
    name: slurm
    comment: "Slurm user"
    uid: "{{ slurm_uid }}"
    group: "{{ slurm_gid }}"
    shell: /bin/bash
    home: /var/lib/slurm
    state: present
  when: slurm_user.rc != 0

- name: install munge
  vars:
    package_name: '{{ munge_packages }}'
    package_repo: "{{ slurm_repos }}"
  include_role:
    name: safe_yum

- name: Create Slurm RPM directory
  become: true
  file:
    path: "{{ download_path }}/slurm_rpms"
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
  when: download_path == '/tmp'

- name: Create Slurm RPM directory
  become: true
  file:
    path: "{{ download_path }}/slurm_rpms"
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
  delegate_to: 127.0.0.1
  run_once: true
  when: download_path != '/tmp'

- name: Download slurm .deb
  get_url:
    url: "https://objectstorage.eu-frankfurt-1.oraclecloud.com/p/lQBJduG5m6xQWauRMPkouaOoliEHbbDIqgfQXou050XAcDav2UveFlRjvFv-0JIn/n/hpc_limited_availability/b/source/o/slurm/{{ slurm_deb_package }}"
    dest: "{{ download_path }}/slurm_rpms/"
  when: ansible_os_family == 'Debian' and download_path == '/tmp'
  
- name: Download slurm .rpm
  get_url:
    url: "https://objectstorage.eu-frankfurt-1.oraclecloud.com/p/lQBJduG5m6xQWauRMPkouaOoliEHbbDIqgfQXou050XAcDav2UveFlRjvFv-0JIn/n/hpc_limited_availability/b/source/o/slurm/{{ item }}"
    dest: "{{ download_path }}/slurm_rpms"
  with_items: "{{slurm_all_packages}}"
  when: ansible_os_family == 'RedHat' and download_path == '/tmp'

- name: Download slurm .deb
  get_url:
    url: "https://objectstorage.eu-frankfurt-1.oraclecloud.com/p/lQBJduG5m6xQWauRMPkouaOoliEHbbDIqgfQXou050XAcDav2UveFlRjvFv-0JIn/n/hpc_limited_availability/b/source/o/slurm/{{ slurm_deb_package }}"
    dest: "{{ download_path }}/slurm_rpms"
  when: ansible_os_family == 'Debian' and download_path != '/tmp'
  delegate_to: 127.0.0.1
  run_once: true

- name: Download slurm .rpm
  get_url:
    url: "https://objectstorage.eu-frankfurt-1.oraclecloud.com/p/lQBJduG5m6xQWauRMPkouaOoliEHbbDIqgfQXou050XAcDav2UveFlRjvFv-0JIn/n/hpc_limited_availability/b/source/o/slurm/{{ item }}"
    dest: "{{ download_path }}/slurm_rpms"
  with_items: "{{slurm_all_packages}}"
  when: ansible_os_family == 'RedHat' and download_path != '/tmp'
  delegate_to: 127.0.0.1
  run_once: true  

- name: Install .deb
  vars:
    deb_name:
      - "{{ download_path }}/slurm_rpms/{{ slurm_deb_package }}"
    package_state: present
  include_role:
    name: safe_yum
  when: ansible_os_family == 'Debian'

- name: install SLURM common packages RedHat
  vars:
    package_name: '{{ slurm_common_packages }}'
    package_repo: "{{slurm_repos}}"
    disable_gpg_check_var: True
  include_role:
    name: safe_yum
  when: ansible_os_family == 'RedHat'

- name: Add Environment variable file for SLurm
  become: true
  template:
    src: 'systemd/slurm_env.j2'
    dest: '/etc/default/slurm'
    backup: "yes"
  when: ansible_os_family == 'Debian'

- name: Create {{ slurm_spool_path }}
  become: true
  file:
    name: "{{ slurm_spool_path }}"
    state: directory
    owner: 'slurm'
    group: 'slurm'
    mode: '0755'

- name: Create /run/slurm/
  become: true
  file:
    name: /run/slurm/
    state: directory
    owner: 'slurm'
    group: 'slurm'
    mode: '0755'

- name: Create munge dir
  become: true
  file:
    name: '{{ munge_conf_path }}'
    state: directory
    owner: munge
    group: munge
    mode: 0700
    
- name: Ensure {{ slurm_log_path }} exists
  become: true
  file:
    path: '{{ slurm_log_path }}'
    owner: slurm
    group: slurm
    mode: 0750
    state: directory

- name: Ensure {{ slurm_conf_path }} exists
  become: true
  file:
    path: '{{ slurm_conf_path }}'
    state: directory

- name: Ensure {{ munge_run_path }} has the correct permissions
  become: true
  file:
    path: '{{ munge_run_path }}'
    owner: munge
    group: munge
    mode: 0755
    state: directory

- name: Ensure {{ munge_log_path }} has the correct permissions
  become: true
  file:
    path: '{{ munge_log_path }}'
    owner: munge
    group: munge
    mode: 0755
    state: directory

- name: Ensure {{ slurm_conf_path }} has the correct permissions
  become: true
  file:
    path: '{{ slurm_conf_path }}'
    owner: slurm
    group: slurm
    mode: 0755
    state: directory

- name: Include pyxis prolog files
  include_tasks: common_pyxis.yml
  when: pyxis|bool

- name: Include pyxis prolog files
  include_tasks: common_pmix.yml
  when: ansible_os_family == 'RedHat'

- name: Ensure prolog directory exists
  become: true
  file:
    path: "{{ slurm_conf_path }}/prolog.d"
    state: directory
    owner: root
    group: root
  when: healthchecks|bool

- name: copy healthchecks
  become: true
  copy: 
    src: healthchecks.sh
    dest: "{{ slurm_conf_path }}/prolog.d/healthchecks.sh"
    owner: root
    group: root
    mode: '0755'
  when: healthchecks|bool

- name: Configure Slurm compute user tags
  ansible.builtin.include_tasks: user_tags.yml
  when: "'controller' in group_names or 'slurm_backup' in group_names or 'compute' in group_names"
