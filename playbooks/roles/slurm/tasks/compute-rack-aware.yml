---

- name: install SLURM compute packages
  vars:
    package_name: '{{ slurm_compute_packages }}'
    package_repo: "{{ slurm_repos }}"
    disable_gpg_check_var: True
  include_role:
    name: safe_yum

- name: Render systemd units for slurm, slurmdbd and munge
  become: true
  template:
    src: 'systemd/{{ item }}.service'
    dest: '/lib/systemd/system/{{ item }}.service'
    backup: "yes"
  with_items:
    - slurmd
  when: ansible_os_family == 'Debian'

- name: Create systemd unit dirs
  become: true
  file:
    name: '/etc/systemd/system/{{ item }}.service.d'
    state: directory
  with_items:
    - munge
    - slurmd

- name: Render systemd units for slurmd and munge
  become: true
  template:
    src: 'systemd/{{ item }}.service.d/unit.conf.j2'
    dest: '/etc/systemd/system/{{ item }}.service.d/unit.conf'
    backup: "yes"
  with_items:
    - munge
    - slurmd

- name: Reload systemd units
  become: true
  systemd:
    daemon_reload: true

- name: Create munge dir
  become: true
  file:
    name: '{{ munge_conf_path }}'
    state: directory
    owner: munge
    group: munge
    mode: 0700

- name: copy munge.key to tmp
  become: true
  shell:
    cmd: cp /etc/munge/munge.key /tmp/munge.key
  delegate_to: 127.0.0.1
  run_once: true

- name: set permissions
  become: true
  shell:
    cmd: chown {{ controller_username }}:{{ controller_username }} /tmp/munge.key
  delegate_to: 127.0.0.1
  run_once: true

- name: Copy munge key
  become: true
  copy:
    src: /tmp/munge.key
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: '0400'
  notify: restart munge

- name: restart munge
  become: true
  service:
    name: munge
    state: restarted
    enabled: true

- name: Run the script to get the RackID
  shell: 'curl -sH "Authorization: Bearer Oracle" -L http://169.254.169.254/opc/v1/host | jq .rackId'
#  shell: echo $RANDOM | md5sum | head -c 20
  register: rackID_script
  retries: 5
  delay: 5
  until: rackID_script is not failed

- name: Set RackID fact
  set_fact:
    rackID: "{{ rackID_script.stdout[1:-41]}}"

- name: Initialize topology node and rack lists
  set_fact:
    nodes_to_add: []
    topology_racks: {}
  run_once: true

- name: Collect compute nodes and their rack switches
  set_fact:
    nodes_to_add: "{{ (nodes_to_add | default([])) + [hostvars[item]['ansible_hostname']] }}"
    topology_racks: "{{ (topology_racks | default({})) | combine({hostvars[item]['ansible_hostname']: cluster_name ~ ':' ~ hostvars[item]['rackID']}) }}"
  with_items: "{{ play_hosts | difference(groups['controller']) | difference(groups['slurm_backup']) | difference(groups['login']) }}"
  run_once: true

- name: Resolve the inactive switch for this queue and instance type
  set_fact:
    topology_keywords: "{{ queues | selectattr('name', 'equalto', queue) | map(attribute='instance_types') | flatten | selectattr('name', 'equalto', instance_type) | map(attribute='instance_keyword') | list }}"
  run_once: true

- name: Require one instance keyword
  assert:
    that:
      - topology_keywords | length == 1
      - topology_keywords[0] | length > 0
    fail_msg: "Expected exactly one instance type in queue {{ queue }}"
  run_once: true

- name: Update topology using exact switch identities
  become: true
  slurm_topology:
    path: "{{ slurm_conf_path }}/topology.conf"
    cluster: "{{ cluster_name }}"
    inactive: "inactive-{{ queue }}-{{ topology_keywords[0] }}"
    nodes: "{{ nodes_to_add }}"
    action: "add"
    racks: "{{ topology_racks }}"
  run_once: true
  delegate_to: 127.0.0.1
  notify: reconfigure slurm

- name: Run Pam settings
  include_tasks: compute_pam.yml
  when: pam|bool

- name: run handlers
  meta: flush_handlers
  
- name: start slurmd
  become: true
  service:
    name: slurmd
    state: restarted
    enabled: true


- name: Update node state on controller
  block:
    - name: Grab Node State
      shell: 'sinfo -h -o "%t" -n {{ ansible_hostname }}'
      register: node_state
      delegate_to: 127.0.0.1
    - set_fact:
        node_state2: "{{ node_state.stdout }}"
    - name: Update node state on controller
      become: true
      command: scontrol update nodename={{ ansible_hostname }} state=RESUME
      when: node_state2 not in ["idle", "alloc", "mix"]
  rescue:
    - name: Sleep 5 seconds
      pause: 
        seconds: 10

    - name: Grab Node State
      shell: 'sinfo -h -o "%t" -n {{ ansible_hostname }}'
      register: node_state
      delegate_to: 127.0.0.1
      until: node_state.stdout.find("failure") == -1
      retries: 10
      delay: 5

    - set_fact:
        node_state2: "{{ node_state.stdout }}"

    - name: Update node state on controller
      become: true
      command: scontrol update nodename={{ ansible_hostname }} state=RESUME
      when: node_state2 not in ["idle", "alloc", "mix"]
      register: result
      retries: 10
      delay: 5
      until: result is not failed
      delegate_to: 127.0.0.1
