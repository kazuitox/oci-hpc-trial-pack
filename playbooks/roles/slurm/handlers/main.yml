- name: reload systemd units
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

# Munge must use the final key before any accounting/controller RPC.
- name: restart munge
  become: true
  service:
    name: munge
    state: restarted
    enabled: true

- name: restart slurm server
  include_tasks: ../tasks/restart-server.yml

- name: restart slurm
  become: true
  service: 
    name: '{{ item }}'
    state: restarted
    enabled: true
  with_items: 
    - slurmd
  register: result
  until: result is not failed
  retries: 5
  delay: 5

- name: reconfigure slurm
  include_tasks: ../tasks/reconfigure.yml
