---
- name: Desktop | include EL8 tasks (Oracle Linux 8)
  include_tasks: el8.yml
  when:
    - queue | default('') == ood_vnc_queue
    - ansible_os_family == 'RedHat'
    - ansible_distribution == 'OracleLinux'
    - ansible_distribution_major_version | string == '8'

- name: Desktop | Install Ubuntu VNC session D-Bus dependency
  ansible.builtin.apt:
    name: dbus-daemon
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - queue | default('') == ood_vnc_queue
    - ansible_distribution == 'Ubuntu'
    - ansible_distribution_version == '24.04'
